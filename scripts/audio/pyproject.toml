[project]
name = "tehillim-audio"
version = "0.1.0"
description = "Renders the recorded voices (audio/) from data/tehillim.json"
requires-python = ">=3.13"
dependencies = [
    "phonikud>=0.4.1",
    "pocket-tts-onnx",
    "soundfile>=0.13",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
pocket-tts-onnx = { git = "https://github.com/thewh1teagle/pocket-tts-onnx" }
